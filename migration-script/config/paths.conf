# Config editable de migration-script. Revisar y actualizar ANTES de cada backup real:
# esta lista refleja lo que Leo tiene hoy (11-09-2026, post-migración a Debian 13), no es
# genérica. Se versiona en git junto con el script.

# --- Directorios personales grandes (módulo 70-personal) ---
# "origen:destino-relativo-en-DEST"
PERSONAL_DIRS=(
  "$HOME/Documents:Documents"
  "$HOME/Videos:Videos"
  "$HOME/Music:Music"
  "$HOME/Pictures:Pictures"
  "$HOME/Downloads:Downloads"
  "$HOME/Public:Public"
  "$HOME/Files:Files"
  "$HOME/GameMakerProjects:GameMakerProjects"
  "$HOME/devTools:devTools"
  "$HOME/go:go"
)

# --- Dotfiles y config sueltos (módulo 10-dotfiles) ---
DOTFILES=(
  "$HOME/.bashrc"
  "$HOME/.profile"
  "$HOME/.tmux.conf"
  "$HOME/.gitconfig"
)

# Directorios grandes de config, con exclusiones de caché
DOTDIRS=(
  "$HOME/.config"
  "$HOME/.local/share"
  "$HOME/.themes"
  "$HOME/.icons"
  "$HOME/.var"
)
DOTDIRS_EXCLUDE=(
  "--exclude=.cache"
  "--exclude=Cache"
  "--exclude=CachedData"
  "--exclude=node_modules"
  "--exclude=_cacache"
)

# --- Secretos (módulo 20-secrets) — nunca se leen, solo se empaquetan ---
SECRET_PATHS=(
  "$HOME/.ssh"
  "$HOME/.gnupg"
  "$HOME/.claude.json"
  "$HOME/.local/share/keyrings"
  "$HOME/.config/rclone"
)
SECRET_ETC_PATHS=(
  "/etc/ssh/ssh_host_ecdsa_key"
  "/etc/ssh/ssh_host_ecdsa_key.pub"
  "/etc/ssh/ssh_host_ed25519_key"
  "/etc/ssh/ssh_host_ed25519_key.pub"
  "/etc/ssh/ssh_host_rsa_key"
  "/etc/ssh/ssh_host_rsa_key.pub"
)
TAILSCALE_STATE="/var/lib/tailscale/tailscaled.state"

# --- Docker (módulo 40-docker) ---
# "directorio-del-compose:contenedor-principal:contenedor-db-o-vacío"
DOCKER_PROJECTS=(
  "$HOME/docker/nextcloud:nextcloud-nextcloud-1:nextcloud-db-1"
)
# Contenedores standalone (sin compose) que también hay que respaldar
DOCKER_STANDALONE_DB_CONTAINERS=(
  "tgpg"
)

# --- libvirt (módulo 60-libvirt) ---
# Solo XML por default. Cambiar a "true" si alguna vez se decide respaldar discos también
# (ver ~/migracion/ESTADO.md: la vez pasada se descartaron, 52 GiB, no valía la pena en el USB).
LIBVIRT_INCLUDE_DISKS=false

# --- Exclusiones globales de red (no copiar, se regeneran solas en la distro nueva) ---
NETWORK_SKIP_PATTERN='docker0|virbr0|br-|^lo$|tailscale0'
